<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10121a" />
  <title>Dragomir's Timetable</title>
  <style>
    :root { --bg:#10121a; --panel:#191c27; --line:#303544; --text:#f6f7fb; --muted:#a7adbd; --blue:#76a9ff; --purple:#b999ff; --orange:#ffb86b; --green:#73dfbd; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; } body { min-width:320px; margin:0; color:var(--text); background:var(--bg); } body::before { position:fixed; z-index:-1; inset:0; background:radial-gradient(circle at 90% 0%,#25325b 0,transparent 32rem),radial-gradient(circle at 0% 80%,#272040 0,transparent 30rem); content:""; } main { width:min(1440px,calc(100% - 42px)); margin:0 auto; padding:42px 0 48px; }
    .header { display:flex; align-items:end; justify-content:space-between; gap:28px; margin-bottom:32px; } .eyebrow { margin:0 0 9px; color:var(--blue); font-size:.76rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } h1 { margin:0; font-size:clamp(2.25rem,5vw,4.5rem); letter-spacing:-.075em; line-height:.9; } .subhead { margin:15px 0 0; color:var(--muted); font-size:1rem; }
    .week-switch { display:flex; gap:7px; padding:5px; border:1px solid var(--line); border-radius:15px; background:#151823; } .week-button { border:0; border-radius:10px; padding:12px 15px; color:var(--muted); background:transparent; font:inherit; font-size:.86rem; font-weight:750; cursor:pointer; transition:.2s ease; } .week-button.active { color:#11131c; background:var(--text); }
    .timetable { overflow:hidden; border:1px solid var(--line); border-radius:22px; background:#171a25e8; box-shadow:0 28px 60px #05060e70; } .week-heading { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); } .week-heading strong { font-size:1rem; } .week-heading span { color:var(--muted); font-size:.86rem; } .schedule-wrap { overflow-x:auto; } .schedule { display:grid; grid-template-columns:76px repeat(5,minmax(160px,1fr)); min-width:920px; } .day,.time { min-height:64px; padding:15px 13px; border-bottom:1px solid var(--line); } .day { border-left:1px solid var(--line); } .day-name { display:block; font-size:.92rem; font-weight:800; } .day-date { display:block; margin-top:3px; color:var(--muted); font-size:.75rem; } .time { display:flex; align-items:flex-start; justify-content:center; color:var(--muted); font-size:.74rem; font-weight:700; } .time.blank { color:transparent; } .slot { position:relative; min-height:96px; padding:8px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); } .slot.overlap { display:grid; grid-template-columns:1fr 1fr; gap:5px; } .lesson { position:absolute; inset:8px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; padding:10px; border-radius:12px; color:#10131c; box-shadow:0 7px 16px #00000024; } .overlap .lesson { position:relative; inset:auto; min-width:0; } .lesson.tutor { background:var(--green); } .lesson.history { background:var(--orange); } .lesson.business { background:var(--purple); } .lesson.cs { background:var(--blue); } .lesson.character { background:#f28ab2; } .lesson-name { font-size:.82rem; font-weight:850; line-height:1.08; } .lesson-meta { display:flex; align-items:end; justify-content:space-between; gap:6px; font-size:.65rem; font-weight:750; line-height:1.1; } .lesson-meta span:last-child { text-align:right; } .empty-note { display:flex; align-items:center; justify-content:center; min-height:96px; color:#666e7d; font-size:.75rem; } .legend { display:flex; flex-wrap:wrap; gap:16px; padding:18px 22px; color:var(--muted); font-size:.78rem; } .legend-item { display:inline-flex; align-items:center; gap:7px; } .dot { width:9px; height:9px; border-radius:50%; }
    @media (max-width:760px) { main { width:min(100% - 24px,1440px); padding-top:27px; } .header { display:block; } .week-switch { width:max-content; margin-top:24px; } .timetable { border-radius:16px; } }
  </style>
</head>
<body>
  <main>
    <header class="header"><div><p class="eyebrow">Northampton Academy · Year 13</p><h1>Dragomir's<br />timetable.</h1><p class="subhead">13E · September 2026</p></div><nav class="week-switch" aria-label="Choose a timetable week"><button class="week-button active" type="button" data-week="0">Week 1</button><button class="week-button" type="button" data-week="1">Week 2</button></nav></header>
    <section class="timetable" aria-label="Weekly timetable"><div class="week-heading"><strong id="schedule-title">Week 1 schedule</strong><span>Tap a different week above to switch</span></div><div class="schedule-wrap"><div class="schedule" id="schedule"></div></div><div class="legend"><span class="legend-item"><i class="dot" style="background:var(--green)"></i>Tutor</span><span class="legend-item"><i class="dot" style="background:var(--orange)"></i>History</span><span class="legend-item"><i class="dot" style="background:var(--purple)"></i>Business</span><span class="legend-item"><i class="dot" style="background:var(--blue)"></i>Computer Science</span><span class="legend-item"><i class="dot" style="background:#f28ab2"></i>Character Development</span></div></section>
  </main>
  <script>
    const weeks=[
      {title:'14–18 September',dates:['14 Sep','15 Sep','16 Sep','17 Sep','18 Sep'],days:[
        [{time:'14:05',name:'History',staff:'DMN',room:'G4',type:'history'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'}],
        [{time:'08:45',name:'History',staff:'JRU',room:'E1',type:'history'},{time:'09:45',name:'History',staff:'JRU',room:'E1',type:'history'},{time:'09:45',name:'Character Development',staff:'DMN',room:'G4',type:'character'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'},{time:'12:30',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business',continuation:true}],
        [{time:'08:45',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'},{time:'09:45',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business',continuation:true},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'Computer Science',staff:'CAU',room:'A17 ICT',type:'cs'},{time:'12:30',name:'Computer Science',staff:'SSF',room:'A18 ICT',type:'cs'}],
        [{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'14:05',name:'Computer Science',staff:'SSF',room:'A18 ICT',type:'cs'}],
        [{time:'08:45',name:'Computer Science',staff:'CAU',room:'A17 ICT',type:'cs'},{time:'09:45',name:'Computer Science',staff:'SSF',room:'A18 ICT',type:'cs'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'History',staff:'DMN',room:'G4',type:'history'},{time:'12:30',name:'History',staff:'DMN',room:'G4',type:'history'},{time:'14:05',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'}]]},
      {title:'21–25 September',dates:['21 Sep','22 Sep','23 Sep','24 Sep','25 Sep'],days:[
        [{time:'14:05',name:'History',staff:'JRU',room:'G4',type:'history'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'}],
        [{time:'08:45',name:'History',staff:'JRU',room:'E1',type:'history'},{time:'09:45',name:'History',staff:'JRU',room:'E1',type:'history'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'},{time:'12:30',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business',continuation:true}],
        [{time:'08:45',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'},{time:'09:45',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business',continuation:true},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'Computer Science',staff:'CAU',room:'A17 ICT',type:'cs'},{time:'12:30',name:'Computer Science',staff:'SSF',room:'A18 ICT',type:'cs'}],
        [{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'14:05',name:'Computer Science',staff:'SSF',room:'A18 ICT',type:'cs'}],
        [{time:'08:45',name:'Computer Science',staff:'CAU',room:'A17 ICT',type:'cs'},{time:'09:45',name:'Computer Science',staff:'CAU',room:'A17 ICT',type:'cs'},{time:'11:10',name:'Tutor',staff:'DMN',room:'G4',type:'tutor'},{time:'11:30',name:'History',staff:'DMN',room:'G4',type:'history'},{time:'12:30',name:'History',staff:'DMN',room:'G4',type:'history'},{time:'14:05',name:'BTEC Business',staff:'ABU',room:'A15 ICT',type:'business'}]]}
    ];
    const times=['08:45','09:45','11:10','11:30','12:30','14:05'],days=['Monday','Tuesday','Wednesday','Thursday','Friday'],schedule=document.getElementById('schedule');
    const escapeHtml=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const lessonCard=lesson=>`<article class="lesson ${lesson.type}"><strong class="lesson-name">${escapeHtml(lesson.name)}</strong><div class="lesson-meta"><span>${lesson.staff}</span><span>${lesson.room}</span></div></article>`;
    function renderWeek(index){const week=weeks[index];document.getElementById('schedule-title').textContent=`Week ${index+1} schedule`;let html='<div class="time blank">Time</div>';days.forEach((day,i)=>html+=`<div class="day"><span class="day-name">${day}</span><span class="day-date">${week.dates[i]}</span></div>`);times.forEach(time=>{html+=`<div class="time">${time}</div>`;week.days.forEach(lessons=>{const found=lessons.filter(lesson=>lesson.time===time);html+=found.length?`<div class="slot ${found.length>1?'overlap':''}">${found.map(lessonCard).join('')}</div>`:'<div class="slot"><div class="empty-note">—</div></div>';});});schedule.innerHTML=html;}
    document.querySelectorAll('.week-button').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.week-button.active').classList.remove('active');button.classList.add('active');renderWeek(Number(button.dataset.week));}));renderWeek(0);
  </script>
</body>
</html>
