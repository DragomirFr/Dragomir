<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Padel Cup</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #09090b;
      --card-bg: rgba(18, 18, 22, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-subtle: #52525b;
      --accent: #7877c6;
      --live: #22c55e;
      --error: #f87171;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.12), transparent),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 3.5rem max(1.25rem, env(safe-area-inset-right)) 4rem max(1.25rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1;
      color: #ffffff;
      user-select: none;
    }

    .pills {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(18, 18, 22, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.4rem 0.95rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-subtle);
    }

    .pill.live .dot {
      background: var(--live);
      animation: pulse 2s infinite;
    }

    .pill.offline .dot { background: var(--error); }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.45); }
      70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Champion */
    .champion {
      text-align: center;
      padding: 1.25rem;
      border-radius: 20px;
      border: 1px solid rgba(120, 119, 198, 0.35);
      background: rgba(120, 119, 198, 0.08);
      box-shadow: 0 12px 40px -12px rgba(120, 119, 198, 0.35);
    }

    .champion small {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    .champion strong {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.25rem;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.5);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.75rem;
      padding: 0 0.25rem;
    }

    h2 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--text-subtle);
      font-weight: 500;
      text-align: right;
    }

    /* Standings */
    .row {
      display: grid;
      grid-template-columns: 1.75rem 1fr repeat(3, 2.1rem) 2.6rem;
      align-items: center;
      padding: 0.8rem 0.25rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .row + .row { border-top: 1px solid var(--border); }

    .row.labels {
      padding-top: 0;
      padding-bottom: 0.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    #standings .row:first-child { border-top: 1px solid var(--border); }

    .row > :nth-child(n+3) { text-align: center; }
    .row > :last-child { text-align: right; }

    .rank { color: var(--text-subtle); font-weight: 700; }
    .row.first .rank { color: var(--accent); }
    .team-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat { color: var(--text-muted); font-size: 0.9rem; }
    .pts { font-weight: 800; color: #ffffff; font-size: 1.05rem; }

    /* Matches */
    .matches {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.5rem;
    }

    .vs {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-subtle);
    }

    .pick {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 0.75rem;
      min-height: 3.25rem;
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }

    .pick:hover {
      border-color: var(--border-hover);
      background: rgba(255, 255, 255, 0.06);
      transform: translateY(-2px);
    }

    .pick:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(120, 119, 198, 0.3);
    }

    .pick.won {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 700;
      box-shadow: 0 10px 28px -10px rgba(255, 255, 255, 0.35);
    }

    .pick.lost {
      color: var(--text-subtle);
      background: transparent;
    }

    footer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-subtle);
      margin-top: 0.75rem;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover { color: #ffffff; }

    .error-text { color: var(--error); }

    @media (max-width: 420px) {
      main { padding-top: 2.5rem; }
      .card { padding: 1rem 0.85rem; }
      .pick { font-size: 0.82rem; padding: 0.8rem 0.5rem; }
      .row { grid-template-columns: 1.5rem 1fr repeat(3, 1.8rem) 2.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pick, footer a { transition: none; }
      .pill.live .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Padel Cup</h1>
      <div class="pills">
        <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Connecting</span></span>
        <span class="pill" id="progressPill">0 of 6 played</span>
      </div>
    </header>

    <div class="champion" id="champion" hidden>
      <small>Champions</small>
      <strong id="championName"></strong>
    </div>

    <section class="card">
      <div class="card-head">
        <h2>Standings</h2>
        <span class="hint">Win = 3 pts</span>
      </div>
      <div class="row labels"><span>#</span><span>Team</span><span>P</span><span>W</span><span>L</span><span>Pts</span></div>
      <div id="standings"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Matches</h2>
        <span class="hint" id="matchHint">Tap the winner</span>
      </div>
      <div class="matches" id="matches"></div>
    </section>

    <footer><a href="/">dragomir.xyz</a></footer>
  </main>

  <script>
    const DATABASE_URL = "https://admin-dragomir-default-rtdb.europe-west1.firebasedatabase.app";
    const TEAMS = ["Dragomir + Leo", "Aurimas + Oskar", "Alex + Norris", "Eesah + Rayan"];
    // Round robin order: every team plays once before anyone plays twice.
    const MATCHES = [
      { id: "m1", a: 0, b: 3 }, { id: "m2", a: 1, b: 2 },
      { id: "m3", a: 0, b: 2 }, { id: "m4", a: 3, b: 1 },
      { id: "m5", a: 0, b: 1 }, { id: "m6", a: 2, b: 3 },
    ];

    let winners = {};   // matchId -> "a" | "b"
    let matchesRef = null;
    const $ = id => document.getElementById(id);

    function standings() {
      const rows = TEAMS.map((name, i) => ({ i, name, p: 0, w: 0, l: 0, pts: 0 }));
      for (const m of MATCHES) {
        const w = winners[m.id];
        if (!w) continue;
        const W = rows[w === "a" ? m.a : m.b], L = rows[w === "a" ? m.b : m.a];
        W.p++; L.p++; W.w++; W.pts += 3; L.l++;
      }
      // Level on points: whoever won their match against each other goes higher.
      const h2h = (x, y) => {
        const m = MATCHES.find(m => (m.a === x.i && m.b === y.i) || (m.a === y.i && m.b === x.i));
        const w = winners[m.id];
        if (!w) return 0;
        return (w === "a" ? m.a : m.b) === x.i ? -1 : 1;
      };
      return rows.sort((x, y) => (y.pts - x.pts) || h2h(x, y) || (x.i - y.i));
    }

    function renderStandings() {
      const rows = standings();
      const box = $("standings");
      box.innerHTML = "";
      rows.forEach((r, k) => {
        const row = document.createElement("div");
        row.className = "row" + (k === 0 && r.p ? " first" : "");
        [[k + 1, "rank"], [r.name, "team-name"], [r.p, "stat"], [r.w, "stat"], [r.l, "stat"], [r.pts, "pts"]]
          .forEach(([v, cls]) => {
            const span = document.createElement("span");
            span.className = cls;
            span.textContent = v;
            row.append(span);
          });
        box.append(row);
      });

      const played = MATCHES.filter(m => winners[m.id]).length;
      $("progressPill").textContent = `${played} of ${MATCHES.length} played`;
      $("champion").hidden = played < MATCHES.length;
      if (played === MATCHES.length) $("championName").textContent = rows[0].name;
    }

    function buildMatches() {
      for (const m of MATCHES) {
        const row = document.createElement("div");
        row.className = "match";
        const vs = document.createElement("span");
        vs.className = "vs";
        vs.textContent = "vs";
        row.append(pickButton(m.id, "a", TEAMS[m.a]), vs, pickButton(m.id, "b", TEAMS[m.b]));
        $("matches").append(row);
      }
    }

    function pickButton(id, side, team) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pick";
      btn.id = `pick-${id}-${side}`;
      btn.textContent = team;
      btn.addEventListener("click", () => pick(id, side));
      return btn;
    }

    function renderMatches() {
      for (const m of MATCHES) {
        const w = winners[m.id];
        for (const side of ["a", "b"]) {
          const btn = $(`pick-${m.id}-${side}`);
          btn.classList.toggle("won", w === side);
          btn.classList.toggle("lost", !!w && w !== side);
          btn.setAttribute("aria-pressed", String(w === side));
          btn.title = w === side ? "Tap again to undo" : `${btn.textContent} won`;
        }
      }
    }

    function render() { renderStandings(); renderMatches(); }

    function pick(id, side) {
      // Tapping the current winner clears the result.
      const next = winners[id] === side ? null : side;
      if (next) winners[id] = next; else delete winners[id];
      render();
      if (!matchesRef) return;
      matchesRef.child(id).set(next).catch(() => {
        setHint("Didn't save. Check your connection and tap again.", true);
      });
    }

    function setStatus(state, text) {
      $("statusPill").className = "pill " + state;
      $("statusText").textContent = text;
    }

    function setHint(text, isError) {
      $("matchHint").textContent = text;
      $("matchHint").className = isError ? "hint error-text" : "hint";
    }

    buildMatches();
    render();

    try {
      firebase.initializeApp({ databaseURL: DATABASE_URL });
      const db = firebase.database();
      matchesRef = db.ref("padel/matches");
      matchesRef.on("value", snap => {
        const data = snap.val() || {};
        winners = {};
        for (const m of MATCHES) {
          if (data[m.id] === "a" || data[m.id] === "b") winners[m.id] = data[m.id];
        }
        render();
      }, () => setStatus("offline", "Can't load results"));
      db.ref(".info/connected").on("value", snap => {
        if (snap.val()) setStatus("live", "Live");
        else setStatus("offline", "Reconnecting");
      });
    } catch (e) {
      setStatus("offline", "Offline");
    }
  </script>
</body>
</html>
