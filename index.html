<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragomir</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">   
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #09090b;
      --border: rgba(255, 255, 255, 0.08);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120, 119, 198, 0.12), transparent),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Main Hero */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      width: 100%;
    }

    h1 {
      font-size: clamp(3.5rem, 11vw, 8.5rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1;
      color: #ffffff;
      user-select: none;
    }

    /* Footer */
    footer {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .social-links {
      display: flex;
      gap: 1.5rem;
    }

    .social-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .social-link:hover {
      color: var(--text-main);
    }

    @media (max-width: 640px) {
      footer {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <main>
    <h1>Dragomir</h1>
  </main>

  <footer>
    <span>&copy; 2026 Dragomir. All rights reserved.</span>
    <div class="social-links">
  <a href="https://discord.com/users/1081642527968460831" target="_blank" rel="noopener noreferrer" class="social-link">Discord</a>
  <a href="https://github.com/DragomirFr" target="_blank" rel="noopener noreferrer" class="social-link">GitHub</a>
</div>
  </footer>

</body>
</html>
